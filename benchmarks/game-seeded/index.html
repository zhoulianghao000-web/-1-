<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月影竞技场 Lunar Arena · v0.9.1</title>
  <meta name="description" content="月影竞技场：一个可离线游玩的小型点击游戏（v0.9.1 演示版本）。">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/game.js" defer></script>
</head>
<body>
  <div class="arena">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">☾</span>
        <span class="brand-name">月影竞技场</span>
        <span class="version">v0.9.1</span>
      </div>
      <dl class="hud" aria-label="角色状态">
        <div class="hud-item">
          <dt>HP</dt>
          <dd id="hp">100</dd>
        </div>
        <div class="hud-item">
          <dt>分数</dt>
          <dd id="score">0</dd>
        </div>
        <div class="hud-item">
          <dt>击杀</dt>
          <dd id="kills">0</dd>
        </div>
        <div class="hud-item">
          <dt>稀有掉落</dt>
          <dd id="rare-count">0</dd>
        </div>
      </dl>
    </header>

    <main class="layout">
      <section class="panel stage" aria-labelledby="stage-title">
        <div class="stage-head">
          <h1 id="stage-title">第一层 · 月影回廊</h1>
          <p class="drop-rate">稀有掉落率：<strong>20%</strong></p>
        </div>

        <div class="enemy">
          <div class="enemy-art" aria-hidden="true">
            <svg viewBox="0 0 220 180" role="presentation">
              <defs>
                <radialGradient id="moonGlow" cx="50%" cy="45%" r="60%">
                  <stop offset="0" stop-color="#f7e7bf"></stop>
                  <stop offset="1" stop-color="#b98c3c" stop-opacity="0"></stop>
                </radialGradient>
                <linearGradient id="wolfBody" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#8c7bb8"></stop>
                  <stop offset="1" stop-color="#2c2344"></stop>
                </linearGradient>
              </defs>
              <circle cx="110" cy="86" r="74" fill="url(#moonGlow)"></circle>
              <path d="M110 26l18 20 26-6-10 25 16 22-24 9-6 26-20-14-20 14-6-26-24-9 16-22-10-25 26 6z" fill="#f6e3b4" opacity=".14"></path>
              <path d="M62 132c8-30 20-48 48-48s40 18 48 48l-18 12H80z" fill="url(#wolfBody)"></path>
              <path d="M86 92l-10-22 26 10zM134 92l10-22-26 10z" fill="#4a3d6e"></path>
              <circle cx="98" cy="104" r="4.5" fill="#f7e7bf"></circle>
              <circle cx="122" cy="104" r="4.5" fill="#f7e7bf"></circle>
              <path d="M104 116l6 5 6-5" stroke="#f7e7bf" stroke-width="2" fill="none" stroke-linecap="round"></path>
              <path d="M64 146c12-6 22-8 32-6l5 14H76zM156 146c-12-6-22-8-32-6l-5 14h25z" fill="#241d36"></path>
            </svg>
          </div>
          <div class="enemy-meta">
            <h2 id="enemy-name">月影狼 · Lv.1</h2>
            <div class="bar" role="progressbar" aria-label="敌人生命值" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
              <span class="bar-fill" id="enemy-hp-bar"></span>
            </div>
            <p class="enemy-hp" id="enemy-hp">敌人 HP：100</p>
          </div>
        </div>

        <div class="controls">
          <button type="button" class="btn btn-primary" id="start">开始游戏</button>
          <button type="button" class="btn btn-danger" id="attack" disabled>攻击</button>
          <button type="button" class="btn btn-ghost" id="save">保存进度</button>
          <button type="button" class="btn btn-ghost" id="load">读取进度</button>
        </div>

        <p class="status" id="save-status" role="status">尚未开始，点击「开始游戏」。</p>

        <div class="gameover" id="gameover" hidden>
          <h2 id="gameover-title">你被击倒了</h2>
          <p>HP 已归零。点击「重开」回到第一层。</p>
          <button type="button" class="btn btn-primary" id="restart">重开</button>
        </div>
      </section>

      <aside class="side">
        <section class="panel loot" aria-labelledby="loot-title">
          <h2 id="loot-title">传说装备</h2>
          <img id="legendary-img" class="loot-art" src="assets/img/legendary.png" alt="传说武器「月影之刃」的预览图">
          <p class="loot-name">月影之刃 · 传说</p>
          <p class="loot-desc">击败 100 只月影狼后掉落（演示数值）。</p>
        </section>
        <section class="panel log-panel" aria-labelledby="log-title">
          <h2 id="log-title">战斗日志</h2>
          <ol class="log" id="log" aria-live="polite"></ol>
        </section>
      </aside>
    </main>

    <footer class="footer">
      <p>月影竞技场 v0.9.1 · 离线演示版 · 仅用于玩法与流程演示</p>
    </footer>
  </div>
</body>
</html>
