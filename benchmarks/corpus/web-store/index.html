<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>陶土商店 · 商品页</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/app.js" defer></script>
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img class="logo-img" src="assets/icon.svg" alt="站点图标">
      <h1>陶土商店 · 商品页</h1>
    </header>
    <main class="panel">
      <p class="lead">手作陶器与日常器物。</p>
      <img class="gallery-image" src="assets/icon.svg">
      <p class="status" id="status" role="status" aria-live="polite">就绪</p>
      <button type="button" class="btn" id="ping">刷新状态</button>
      <form id="signup" class="signup">
        <label for="email">邮箱</label>
        <input type="email" id="email" name="email" placeholder="you@example.com">
        <button type="submit" class="btn">订阅</button>
      </form>
    </main>
    <footer class="site-footer"><p>© 2026 陶土商店 · 演示站点</p></footer>
  </div>
</body>
</html>
